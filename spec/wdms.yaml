openapi: 3.0.2
info:
  title: Wellbore DDMS OSDU
  description: build local
  version: '0.2'
paths:
  /about:
    get:
      summary: Get About
      operationId: get_about_about_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
  /version:
    get:
      summary: Get Version
      operationId: get_version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetailsResponse'
      security:
        - OpenDESBearerToken: []
  /ddms/v2/status:
    get:
      tags:
        - Wellbore DDMS
      summary: Get the status of the service
      operationId: about_ddms_v2_status_get
      parameters:
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: opendes
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1AboutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - OpenDESBearerToken: []
  /ddms/v2/wells/{wellid}:
    get:
      tags:
        - Well
      summary: Get the Well using wks:well:1.0.2 schema
      description: "Get the Well object using its **id**.  <p>If the well kind is\n\
        \        *wks:well:1.0.2* returns the record directly</p> <p>If the well\n\
        \        kind is different *wks:well:1.0.2* it will get the raw record and\n\
        \        convert the results to match the *wks:well:1.0.2*. If convertion\
        \ is\n        not possible returns an error **500**"
      operationId: get_well
      parameters:
        - required: true
          schema:
            title: Wellid
            type: string
          name: wellid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: opendes
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/well'
        '404':
          description: Well not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - OpenDESBearerToken: []
    delete:
      tags:
        - Well
      summary: Delete the well. The API performs a logical deletion of the given record
      operationId: del_well
      parameters:
        - required: true
          schema:
            title: Wellid
            type: string
          name: wellid
          in: path
        - required: false
          schema:
            title: Recursive
            type: boolean
            default: false
          name: recursive
          in: header
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: opendes
          name: data-partition-id
          in: header
      responses:
        '204':
          description: Record deleted successfully
        '404':
          description: Well not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - OpenDESBearerToken: []
