          in: header
      responses:
        '200':
          description: bulk data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLogDataResponse'
              example:
                columns:
                  - Ref
                  - col_1
                  - col_2
                index:
                  - 0
                  - 1
                  - 2
                data:
                  - - 1
                    - 10
                    - 11
                  - - 1.5
                    - 20
                    - 21
                  - - 2
                    - 30
                    - 31
        '404':
          description: log not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - OpenDESBearerToken: []
    put:
      tags:
        - Log
      summary: Writes the specified data to the log (atomic).
      description: Overwrite if exists
      operationId: write_log_data
      parameters:
        - required: true
          schema:
            title: Logid
            type: string
          name: logid
          in: path
        - description: define format when using JSON data is used. Value can be split,
            index, columns, records, values
          required: false
          schema:
            title: Orient
            type: string
            description: define format when using JSON data is used. Value can be
              split, index, columns, records, values
            default: split
          name: orient
          in: query
        - description: The json path to the bulk reference (see https://goessner.net/articles/JsonPath/).
            Required for non wks:log.
          required: false
          schema:
            title: Bulk-Path
            type: string
            description: The json path to the bulk reference (see https://goessner.net/articles/JsonPath/).
              Required for non wks:log.
          name: bulk-path
          in: query
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: opendes
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUpdateRecordsResponse'
        '404':
          description: log not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - OpenDESBearerToken: []
      requestBody:
        description: "bulk data provides in format corresponding to the _orient_ value:\
          \  \n* split: {\"columns\":[\"Ref\",\"col_1\",\"col_2\"],\"index\":[0,1,2],\"\
          data\":[[1.0,10,11],[1.5,20,21],[2.0,30,31]]}\n* index: {\"0\":{\"Ref\"\
          :1.0,\"col_1\":10,\"col_2\":11},\"1\":{\"Ref\":1.5,\"col_1\":20,\"col_2\"\
          :21},\"2\":{\"Ref\":2.0,\"col_1\":30,\"col_2\":31}}\n* columns: {\"Ref\"\
          :{\"0\":1.0,\"1\":1.5,\"2\":2.0},\"col_1\":{\"0\":10,\"1\":20,\"2\":30},\"\
          col_2\":{\"0\":11,\"1\":21,\"2\":31}}\n* records: [{\"Ref\":1.0,\"col_1\"\
          :10,\"col_2\":11},{\"Ref\":1.5,\"col_1\":20,\"col_2\":21},{\"Ref\":2.0,\"\
          col_1\":30,\"col_2\":31}]\n* values: [[1.0,10,11],[1.5,20,21],[2.0,30,31]]"
        required: true
        content:
          application/json:
            schema:
              example:
                columns:
                  - Ref
                  - col_1
                  - col_2
                index:
                  - 0
                  - 1
                  - 2
                data:
                  - - 1
                    - 10
                    - 11
                  - - 1.5
                    - 20
                    - 21
                  - - 2
                    - 30
                    - 31
              oneOf:
                - title: SplitFormat
                  type: object
                  properties:
                    data:
                      title: Data
                      anyOf:
                        - type: array
                          items:
                            anyOf:
                              - type: string
                              - type: integer
                              - type: number
                        - type: array
                          items:
                            type: array
                            items:
                              anyOf:
                                - type: string
                                - type: integer
                                - type: number
                    columns:
                      title: Columns
                      type: array
                      items:
                        anyOf:
                          - type: string
                          - type: integer
                          - type: number
                    index:
                      title: Index
                      type: array
                      items:
                        anyOf:
                          - type: string
                          - type: integer
                          - type: number
                  required:
                    - data
                - title: IndexFormat
                  type: object
                  properties:
                    TODO:
                      title: Todo
                      type: string
                  required:
                    - TODO
                - title: ColumnFormat
                  type: object
                  properties:
                    TODO:
                      title: Todo
                      type: string
                  required:
                    - TODO
                - title: RecordsFormat
                  type: object
                  properties:
                    TODO:
                      title: Todo
                      type: string
                  required:
                    - TODO
                - title: ValuesFormat
                  type: array
                  items:
                    type: array
                    items:
                      anyOf:
                        - type: string
                        - type: integer
                        - type: number
