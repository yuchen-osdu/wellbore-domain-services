  /query/wellbores/bydistance:
    post:
      tags:
        - Search
      summary: 'Query with cursor, CRS format: data.wellHeadWgs84'
      description: |-
        Get all Wellbores object in a specific area. <p>The specific area will be define by a circle
                    based on its center coordinates (lat, lon) and radius (meters) </p>
                    <p>The wellbore kind is *:wks:wellbore:* returns all records directly based on existing schemas</p>
      operationId: query_ddms_query_wellbores_bydistance_post
      parameters:
        - required: true
          schema:
            title: Latitude
            type: number
          name: latitude
          in: query
        - required: true
          schema:
            title: Longitude
            type: number
          name: longitude
          in: query
        - required: true
          schema:
