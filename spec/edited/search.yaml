openapi: 3.0.2
info:
  title: Wellbore DDMS Search OSDU
  version: '0.2'
servers:
  - url: https://api.example.com/osdu/wdms/search/v2
security:
- bearer: []
- appkey: []
paths:
  /query:
    post:
      tags:
        - Search
      summary: Query
      operationId: query_ddms_query_post
      parameters:
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
          name: data-partition-id
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  /query_with_cursor:
    post:
      tags:
        - Search
      summary: Query with cursor
      operationId: query_ddms_query_with_cursor_post
      parameters:
        - description: identifier of the data partition to query
