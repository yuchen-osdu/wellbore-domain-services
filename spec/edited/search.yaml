components:
  schemas:
    ByBoundingBox:
      title: ByBoundingBox
      required:
        - topLeft
        - bottomRight
      type: object
      properties:
        topLeft:
          $ref: '#/components/schemas/Point'
        bottomRight:
          $ref: '#/components/schemas/Point'
    ByDistance:
      title: ByDistance
      required:
        - point
      type: object
      properties:
        distance:
          title: Distance
          type: number
        point:
          $ref: '#/components/schemas/Point'
    ByGeoPolygon:
      title: ByGeoPolygon
      type: object
      properties:
        points:
          title: Points
          type: array
          items:
            $ref: '#/components/schemas/Point'
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        errors:
          title: Errors
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    Point:
      title: Point
      type: object
      properties:
        latitude:
          title: Latitude
          type: number
        longitude:
          title: Longitude
          type: number
    QueryRequest:
      title: QueryRequest
      required:
        - kind
      type: object
      properties:
        kind:
          title: Kind
          type: string
        limit:
          title: Limit
          type: integer
        query:
          title: Query
          type: string
        returnedFields:
          title: Returnedfields
          type: array
          items:
            type: string
        sort:
          $ref: '#/components/schemas/SortQuery'
        queryAsOwner:
          title: Queryasowner
          type: boolean
        spatialFilter:
          $ref: '#/components/schemas/SpatialFilter'
        offset:
          title: Offset
          type: integer
    SortQuery:
      title: SortQuery
      type: object
      properties:
        field:
          title: Field
          type: array
          items:
            type: string
        order:
          title: Order
          type: string
          enum: ['ASC', 'DESC']
    SpatialFilter:
      title: SpatialFilter
      type: object
      properties:
        field:
          title: Field
          type: string
        byBoundingBox:
          $ref: '#/components/schemas/ByBoundingBox'
        byDistance:
          $ref: '#/components/schemas/ByDistance'
        byGeoPolygon:
          $ref: '#/components/schemas/ByGeoPolygon'
    ValidationError:
      title: ValidationError
      required:
        - loc
        - msg
        - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            type: string
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
  securitySchemes:
    bearer:
      type: apiKey
      name: Authorization
      in: header
    appkey:
      type: apiKey
      in: header
      name: appkey