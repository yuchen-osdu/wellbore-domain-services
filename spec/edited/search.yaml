        - appkey: []
  /query/wellbores:
    post:
      tags:
        - Search
      summary: Query with cursor
      description: |-
        Get all Wellbores object.  <p>The wellbore kind is
                *:wks:wellbore:* returns all records directly based on existing schemas</p>
      operationId: query_ddms_query_wellbores_post
      parameters:
        - required: false
          schema:
            title: Query
            type: string
          name: query
          in: query
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
          name: data-partition-id
          in: header
