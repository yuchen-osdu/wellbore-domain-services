          description: Only meter unit is supported for the moment
        zCoordinate:
          title: The Z coordinate of the dip
          allOf:
            - $ref: '#/components/schemas/ValueWithUnit'
          description: Only meter unit is supported for the moment
        classification:
          title: Classification of the dip
          type: string
          description: Any string is accepted.
      example:
        reference:
          unitKey: meter
          value: 1000.5
        azimuth:
          unitKey: dega
          value: 42
        inclination:
          unitKey: dega
          value: 9
        quality:
          unitKey: unitless
          value: 0.5
        xCoordinate:
          unitKey: meter
          value: 2
        yCoordinate:
          unitKey: meter
          value: 45
        zCoordinate:
