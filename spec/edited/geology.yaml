openapi: 3.0.2
info:
  title: Wellbore DDMS Geology OSDU
  version: '0.2'
servers:
    - url: https://api.evq.csp.slb.com/osdu/wdms/geology/v2
security:
    - bearer: [ ]
    - appkey: [ ]
paths:
  '/markers/{markerid}':
    get:
      tags:
        - Marker
      summary: 'Get the marker using wks:marker:1.0.4 schema'
      description: 'Get the Marker object using its **id**. <p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: get_marker
      parameters:
        - required: true
          schema:
            title: Markerid
            type: string
          name: markerid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marker'
        '404':
          description: marker not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
    delete:
      tags:
        - Marker
      summary: Delete the marker. The API performs a logical deletion of the given record
      description: '<p>Required roles: ''users.datalake.editors'' or ''users.datalake.admins''.</p>'
      operationId: del_marker
      parameters:
        - required: true
          schema:
            title: Markerid
            type: string
          name: markerid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '204':
          description: Record deleted successfully
        '404':
          description: Marker not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/markers/{markerid}/versions':
    get:
      tags:
        - Marker
      summary: Get all versions of the marker
      description: '<p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: get_marker_versions
      parameters:
        - required: true
          schema:
            title: Markerid
            type: string
          name: markerid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordVersions'
        '404':
          description: marker not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/markers/{markerid}/versions/{version}':
    get:
      tags:
        - Marker
      summary: 'Get the given version of marker using wks:marker:1.0.4 schema'
      description: '<p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: get_marker_version
      parameters:
        - required: true
          schema:
            title: Markerid
            type: string
          name: markerid
          in: path
        - required: true
          schema:
            title: Version
            type: integer
          name: version
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marker'
        '404':
          description: marker not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  /markers:
    post:
      tags:
        - Marker
      summary: 'Create or update the markers using wks:marker:1.0.4 schema'
      description: '<p>Required roles: ''users.datalake.editors'' or ''users.datalake.admins''.</p>'
      operationId: post_marker
      parameters:
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      requestBody:
        content:
          application/json:
            schema:
              title: Markers
              type: array
              items:
                $ref: '#/components/schemas/marker'
              example:
                - acl:
                    viewers:
                      - 'data.default.viewers@{{datapartitionid}}.{{domain}}.com'
                    owners:
                      - 'data.default.owners@{{datapartitionid}}.{{domain}}.com'
                  data:
                    depth:
                      unitKey: ft
                      value: 150
                    md:
                      unitKey: ft
                      value: 150
                    tvd:
                      unitKey: ft
                      value: 200
                    name: myMarker
                    relationships:
                      well:
                        confidence: 1
                        id: '{{datapartitionid}}:well:myWell'
                        name: myWell
                      wellbore:
                        confidence: 1
                        id: '{{datapartitionid}}:wellbore:myWellbore'
                        name: myWellbore
                  id: '{{datapartitionid}}:marker:myMarker'
                  kind: '{{datapartitionid}}:wks:marker:1.0.4'
                  legal:
                    legaltags:
                      - '{{legaltags}}'
                    otherRelevantDataCountries:
                      - FR
                      - US
                    status: compliant
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUpdateRecordsResponse'
        '400':
          description: Missing mandatory parameter or unknown parameter
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  /dipsets:
    post:
      tags:
        - Dipset
      summary: 'Create or update the DipSets using wks:dipSet:1.0.0 schema'
      description: '<p>Required roles: ''users.datalake.editors'' or ''users.datalake.admins''.</p>'
      operationId: post_dipset
      parameters:
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      requestBody:
        content:
          application/json:
            schema:
              title: Dipsets
              type: array
              items:
                $ref: '#/components/schemas/dipset'
              example:
                - acl:
                    viewers:
                      - 'data.default.viewers@{{datapartitionid}}.{{domain}}.com'
                    owners:
                      - 'data.default.owners@{{datapartitionid}}.{{domain}}.com'
                  data:
                    classification: Externally Processed LogSet
                    name: myDipSet
                    relationships:
                      well:
                        confidence: 1
                        id: '{{datapartitionid}}:well:myWell'
                        name: myWell
                      wellbore:
                        confidence: 1
                        id: '{{datapartitionid}}:wellbore:myWellbore'
                        name: myWellbore
                  id: '{{datapartitionid}}:dipSet:myDipSet'
                  kind: '{{datapartitionid}}:wks:dipSet:0.0.1'
                  legal:
                    legaltags:
                      - '{{legaltags}}'
                    otherRelevantDataCountries:
                      - FR
                      - US
                    status: compliant
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUpdateRecordsResponse'
        '400':
          description: Missing mandatory parameter or unknown parameter
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/dipsets/{dipsetid}/versions/{version}':
    get:
      tags:
        - Dipset
      summary: 'Get the given version of DipSet using wks:dipset:1.0.0 schema'
      description: '"Get the DipSet object using its **id**. <p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: get_dipset_version
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - required: true
          schema:
            title: Version
            type: integer
          name: version
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dipset'
        '404':
          description: DipSet not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/dipsets/{dipsetid}/versions':
    get:
      tags:
        - Dipset
      summary: Get all versions of the dipset
      description: '<p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: get_dipset_versions
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordVersions'
        '404':
          description: DipSet not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/dipsets/{dipsetid}':
    get:
      tags:
        - Dipset
      summary: 'Get the DipSet using wks:dipSet:1.0.0 schema'
      description: 'Get the DipSet object using its **id**. <p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: get_dipset
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dipset'
        '404':
          description: DipSet not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
    delete:
      tags:
        - Dipset
      summary: Delete the DipSet. The API performs a logical deletion of the given record
      description: '<p>Required roles: ''users.datalake.editors'' or ''users.datalake.admins''.</p>'
      operationId: del_dipset
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - description: Whether or not to delete records children
          required: false
          schema:
            title: Recursive
            type: boolean
            description: Whether or not to delete records children
            default: false
          name: recursive
          in: query
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '204':
          description: Record deleted successfully
        '404':
          description: DipSet not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/dipsets/{dipsetid}/dips':
    get:
      tags:
        - Dips
      summary: Get dips
      description: |-
        Return dips from dipset from the given index until the given number of dips specifed in query parameters. 
            If not specified returns all dips from dipset. <p>Required roles: 'users.datalake.viewers' or 'users.datalake.editors' or 'users.datalake.admins'. In addition, users must be a member of data groups to access the data.</p>
      operationId: get_dips
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - required: false
          schema:
            title: Index
            minimum: 0
            type: integer
          name: index
          in: query
        - required: false
          schema:
            title: Limit
            minimum: 0
            type: integer
          name: limit
          in: query
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Dips Ddms V2 Dipsets  Dipsetid  Dips Get
                type: array
                items:
                  $ref: '#/components/schemas/Dip'
        '404':
          description: DipSet not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
    post:
      tags:
        - Dips
      summary: Define the dips of the dipset
      description: 'Replace previous dips by provided dips. Sort dips by reference and azimuth. <p>Required roles: ''users.datalake.editors'' or ''users.datalake.admins''.</p>'
      operationId: post_dips
      parameters:
        - description: The ID of the dipset
          required: true
          schema:
            title: Dipsetid
            type: string
            description: The ID of the dipset
          name: dipsetid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      requestBody:
        content:
          application/json:
            schema:
              title: Dips
              type: array
              items:
                $ref: '#/components/schemas/Dip'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Post Dips Ddms V2 Dipsets  Dipsetid  Dips Post
                type: array
                items:
                  $ref: '#/components/schemas/Dip'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/dipsets/{dipsetid}/dips/insert':
    post:
      tags:
        - Dips
      summary: insert dip in  a dipset
      description: |-
        Insert dips in dipset. 
            Existing dips are not replaced. 
            Several dip can have same reference. 
            Operation will sort by reference all dips in dipset (may modify dip indexes). <p>Required roles: 'users.datalake.editors' or 'users.datalake.admins'.</p>
      operationId: insert_dips
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      requestBody:
        content:
          application/json:
            schema:
              title: Dips
              type: array
              items:
                $ref: '#/components/schemas/Dip'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Insert Dips Ddms V2 Dipsets  Dipsetid  Dips Insert Post
                type: array
                items:
                  $ref: '#/components/schemas/Dip'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/dipsets/{dipsetid}/dips/query':
    get:
      tags:
        - Dips
      summary: Query dip from dipset
      description: 'Search dip within reference interval and specific classification. <p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: query_dip
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - description: Min reference for the dips to search in the dipset
          required: false
          schema:
            title: Minreference
            type: number
            description: Min reference for the dips to search in the dipset
          name: minReference
          in: query
        - required: false
          schema:
            title: Max reference for the dips to search in the dipset
            type: number
          name: maxReference
          in: query
        - required: false
          schema:
            title: Classification for the dip to search in the dipset
            type: string
          name: classification
          in: query
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Query Dip Ddms V2 Dipsets  Dipsetid  Dips Query Get
                type: array
                items:
                  $ref: '#/components/schemas/Dip'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/dipsets/{dipsetid}/dips/{index}':
    get:
      tags:
        - Dips
      summary: Get a dip at index
      description: '"Return dip from dipset at the given index. <p>Required roles: ''users.datalake.viewers'' or ''users.datalake.editors'' or ''users.datalake.admins''. In addition, users must be a member of data groups to access the data.</p>'
      operationId: get_dip_by_index
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - required: true
          schema:
            title: Index
            type: integer
          name: index
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dip'
        '404':
          description: DipSet or index not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
    delete:
      tags:
        - Dips
      summary: Delete a dip
      description: 'Removes the dip at index. <p>Required roles: ''users.datalake.editors'' or ''users.datalake.admins''.</p>'
      operationId: delete_dip_by_index
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - required: true
          schema:
            title: Index
            type: integer
          name: index
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Delete Dip By Index Ddms V2 Dipsets  Dipsetid  Dips  Index  Delete
                type: array
                items:
                  $ref: '#/components/schemas/Dip'
        '404':
          description: DipSet or index not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
    patch:
      tags:
        - Dips
      summary: Update dip
      description: |-
        "Update dip at index     
            Operation will sort by reference all dips in dipset (may modify dip indexes).
      operationId: patch_dip
      parameters:
        - required: true
          schema:
            title: Dipsetid
            type: string
          name: dipsetid
          in: path
        - required: true
          schema:
            title: Index
            type: integer
          name: index
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dip'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Patch Dip Ddms V2 Dipsets  Dipsetid  Dips  Index  Patch
                type: array
                items:
                  $ref: '#/components/schemas/Dip'
        '404':
          description: DipSet not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
