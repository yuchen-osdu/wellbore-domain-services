  '/logs/{logid}/versions/{version}/data':
    get:
      tags:
        - Log
      summary: Returns all data within the specified filters. Strongly consistent.
      description: return full bulk data
      operationId: get_log_data_by_version
      parameters:
        - required: true
          schema:
            title: Logid
            type: string
          name: logid
          in: path
        - required: true
          schema:
            title: Version
            type: integer
          name: version
          in: path
        - description: 'define format when using JSON data is used. Value can be split, index, columns, records, values'
          required: false
          schema:
            title: Orient
            pattern: split|index|columns|records|values
            type: string
            description: 'define format when using JSON data is used. Value can be split, index, columns, records, values'
            default: split
          name: orient
          in: query
        - description: 'The json path to the bulk reference (see https://goessner.net/articles/JsonPath/). Required for non wks:log.'
          required: false
          schema:
            title: Bulk-Path
            type: string
            description: 'The json path to the bulk reference (see https://goessner.net/articles/JsonPath/). Required for non wks:log.'
          name: bulk-path
          in: query
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: |-
            Get log bulk data in format in the given _orient_ value.
            It uses [Pandas.Dataframe json format](https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.DataFrame.to_json.html).
             Here're examples for data with 5 rows and 3 columns with different _orient_: 
            * split:  <br/>`{"columns":["Ref","col_100X","col_200X"],"index":[0,1,2,3,4],"data":[[0.0,1001,2001],[0.5,1002,2002],[1.0,1003,2003],[1.5,1004,2004],[2.0,1005,2005]]}`<br/>&nbsp;
            * index:  <br/>`{"0":{"Ref":0.0,"col_100X":1001,"col_200X":2001},"1":{"Ref":0.5,"col_100X":1002,"col_200X":2002},"2":{"Ref":1.0,"col_100X":1003,"col_200X":2003},"3":{"Ref":1.5,"col_100X":1004,"col_200X":2004},"4":{"Ref":2.0,"col_100X":1005,"col_200X":2005}}`<br/>&nbsp;
            * columns:  <br/>`{"Ref":{"0":0.0,"1":0.5,"2":1.0,"3":1.5,"4":2.0},"col_100X":{"0":1001,"1":1002,"2":1003,"3":1004,"4":1005},"col_200X":{"0":2001,"1":2002,"2":2003,"3":2004,"4":2005}}`<br/>&nbsp;
            * records:  <br/>`[{"Ref":0.0,"col_100X":1001,"col_200X":2001},{"Ref":0.5,"col_100X":1002,"col_200X":2002},{"Ref":1.0,"col_100X":1003,"col_200X":2003},{"Ref":1.5,"col_100X":1004,"col_200X":2004},{"Ref":2.0,"col_100X":1005,"col_200X":2005}]`<br/>&nbsp;
            * values:  <br/>`[[0.0,1001,2001],[0.5,1002,2002],[1.0,1003,2003],[1.5,1004,2004],[2.0,1005,2005]]`<br/>&nbsp;
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLogDataResponse'
              example: '{"columns":["Ref","col_100X","col_200X"],"index":[0,1,2,3,4],"data":[[0.0,1001,2001],[0.5,1002,2002],[1.0,1003,2003],[1.5,1004,2004],[2.0,1005,2005]]}'
        '404':
          description: log not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
