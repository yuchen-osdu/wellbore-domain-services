security:
- bearer: []
- appkey: []
paths:
  /about:
    get:
      summary: Get About
      operationId: get_about_ddms_v2_about_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
  /version:
    get:
      summary: Get Version
      operationId: get_version_ddms_v2_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetailsResponse'
      security:
        - bearer: []
        - appkey: []
  /status:
    get:
      summary: Get the status of the service
      operationId: about_ddms_v2_status_get
      parameters:
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1AboutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
  '/wells/{wellid}':
    get:
      tags:
        - Well
      summary: 'Get the Well using wks:well:1.0.2 schema'
      description: |-
        Get the Well object using its **id**.  <p>If the well kind is
                *wks:well:1.0.2* returns the record directly</p> <p>If the well
                kind is different *wks:well:1.0.2* it will get the raw record and
                convert the results to match the *wks:well:1.0.2*. If convertion is
                not possible returns an error **500**
      operationId: get_well
      parameters:
        - required: true
          schema:
            title: Wellid
            type: string
          name: wellid
          in: path
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/well'
        '404':
          description: Well not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
    delete:
      tags:
        - Well
      summary: Delete the well. The API performs a logical deletion of the given record
      operationId: del_well
      parameters:
        - required: true
          schema:
            title: Wellid
            type: string
          name: wellid
          in: path
        - description: Whether or not to delete records children
          required: false
          schema:
            title: Recursive
            type: boolean
            description: Whether or not to delete records children
            default: false
          name: recursive
          in: query
        - description: identifier of the data partition to query
          required: false
          schema:
            title: data partition id
            minLength: 1
            type: string
            description: identifier of the data partition to query
            default: slb-osdu-dev-sis-internal-hq
          name: data-partition-id
          in: header
      responses:
        '204':
          description: Record deleted successfully
        '404':
          description: Well not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - bearer: []
        - appkey: []
