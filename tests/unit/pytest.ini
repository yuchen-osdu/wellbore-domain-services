[pytest]

asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope=function

#Registering Markers
markers=
    slow: marks tests as slow (deselect with '-m "not slow"')
    serial: Tests that fails when running ni parallel
    perf: performance test
    hypothesis: Tests that generates data using hypothesis (might fail when running in parallel)
    statistics: Tests specific to feature statistics
    chunking: Tests chunking

addopts =
    ### Tests duration investigation ###
    ## To get a list of the slowest 25 durations (tests, setup and teardown)
    --durations=25
    ## To get a list of the slowest test over 1.0s long
    #--durations-min=1.0

    ## Avoid marker typo
    --strict-markers

    ## Troubleshoot
    #--cache-clear

    ### RANDOMLY ###
    ## Repeat the last random run
    #--randomly-seed=last
    ## Repeat a randomness seed
    #--randomly-seed=1234
    ## Disable randomly
    #-p no:randomly

    ### Parallel Testing ###
    ## Distributing tests across multiple CPUs
    #-n 4 -m "not serial"
    ## Quicker (skipping serial and slow test)
    #-n 4 -m "not serial and not slow"
    ## To Run serial test in serial
    #-n 0 -m "serial"
    ## Run slow tests in parallel
    #-n auto -m "slow"

    ### Ignore specifics test/module
    ## Ignore model_curated_test ##
    #--ignore tests/unit/model_curated
    ## Ignore api_spec test
    # Using '-k test_name' instead '--ignore test_node' because name doesn't depend of  working dir.
    #-k-api_spec_test























