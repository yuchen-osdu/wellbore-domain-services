# Service Config
image: __CONTAINER__
imagePullPolicy: Always
service:
  type: ClusterIP
  port: 8080
  apiPath: /api/os-wellbore-ddms
  readinessProbeHttpPath: /api/os-wellbore-ddms/ddms/v2/about
  livenessProbeHttpPath: /api/os-wellbore-ddms/ddms/v2/about
environmentVariables:
  - name: APPLICATION_PORT
    value: "{{ .Values.service.port }}"
  - name: AWS_REGION
    value: "{{ .Values.global.region }}"
  - name: ENVIRONMENT
    value: "{{ .Values.global.resourcePrefix }}"
  - name: CLOUD_PROVIDER
    value: aws
  - name: LOG_LEVEL
    value: "{{ default `INFO` .Values.global.logLevel }}"
  - name: SSM_ENABLED
    value: "True"
  - name: SSL_ENABLED
    value: "false"
  - name: SERVICE_HOST_ENTITLEMENTS
    value: http://os-entitlements.osdu-services:8080/api/entitlements
  - name: SERVICE_HOST_STORAGE
    value: http://os-storage.osdu-services:8080/api/storage
  - name: SERVICE_HOST_SEARCH
    value: http://os-search.osdu-services:8080/api/search
  - name: PARTITION_HOST
    value: http://os-partition.osdu-services:8080/api/partition/v1
  - name: CACHE_CLUSTER_KEY
    value: "{{ .Values.global.cacheClusterKey }}"

# Resource Config
replicaCount: 1
resources:
  limits:
    memory: 4Gi
  requests:
    cpu: "1"
    memory: 4Gi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 50

# Security Config
serviceAccountRole: arn:aws:iam::{{ .Values.global.accountID }}:role/osdu-{{ .Values.global.resourcePrefix }}-{{ .Values.global.region }}-{{ include "common.name" . }}
cors:
  maxAge: "60m"
  allowCredentials: true
  allowMethods:
    - POST
    - GET
    - PUT
    - DELETE
  allowHeaders:
    - Authorization
    - Data-Partition-Id
    - Correlation-Id
    - Content-Type
securityContext: 
  runAsUser: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
podSecurityContext: 
  fsGroup: 1337
  seccompProfile:
    type: RuntimeDefault