global:
  domain: ""
  limitsEnabled: true
  dataPartitionId: ""
  tier: ""
  autoscalingMode: "cpu"

data:
  logLevel: "ERROR"
  requestsCpu: "370m"
  requestsMemory: "710Mi"
  limitsCpu: "1"
  limitsMemory: "3G"
  image: ""
  imagePullPolicy: "IfNotPresent"
  serviceAccountName: "wellbore"
  WDMSWorkerHost: "http://wellbore-worker"
  affinityLabelsSpot:
    cloud.google.com/gke-provisioning:
      - spot

conf:
  configmap: "wellbore-config"
  appName: "wellbore"

istio:
  proxyCPU: "5m"
  proxyCPULimit: "200m"
  proxyMemory: "50Mi"
  proxyMemoryLimit: "256Mi"

hpa:
  minReplicas: 1
  maxReplicas: 6
  cpu:
    utilization: 200
    scaleUpStabilizationWindowSeconds: 30
    scaleUpValue: 200
    scaleUpPeriod: 15
    scaleDownStabilizationWindowSeconds: 150
    scaleDownValue: 100
    scaleDownPeriod: 15
  requests:
    targetType: "AverageValue"
    targetValue: 86
    scaleUpStabilizationWindowSeconds: 10
    scaleUpValue: 50
    scaleUpPeriod: 15
    scaleDownStabilizationWindowSeconds: 60
    scaleDownValue: 25
    scaleDownPeriod: 60

limits:
  maxTokens: 50
  tokensPerFill: 50
  fillInterval: "1s"
