global:
  domain: ""
  onPremEnabled: false

data:
  logLevel: "ERROR"
  requestsCpu: "130m"
  requestsMemory: "750Mi"
  limitsCpu: "1"
  limitsMemory: "3G"
  image: ""
  imagePullPolicy: "IfNotPresent"
  serviceAccountName: "wellbore"
  projectId: ""

conf:
  configmap: "wellbore-config"
  appName: "wellbore"
  keycloakSecretName: "wellbore-keycloak-secret"
  minioSecretName: "wellbore-minio-secret"

istio:
  proxyCPU: "10m"
  proxyCPULimit: "200m"
  proxyMemory: "64Mi"
  proxyMemoryLimit: "256Mi"
