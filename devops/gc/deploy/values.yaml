global:
  domain: ""
  onPremEnabled: false
  limitsEnabled: true
  dataPartitionId: ""

data:
  logLevel: "ERROR"
  requestsCpu: "370m"
  requestsMemory: "710Mi"
  limitsCpu: "1"
  limitsMemory: "3G"
  image: ""
  imagePullPolicy: "IfNotPresent"
  serviceAccountName: "wellbore"
  WDMSWorkerHost: "http://wellbore-worker"

conf:
  configmap: "wellbore-config"
  appName: "wellbore"
  keycloakSecretName: "wellbore-keycloak-secret"
  minioSecretName: "wellbore-minio-secret"
  replicas: 1

istio:
  proxyCPU: "5m"
  proxyCPULimit: "200m"
  proxyMemory: "50Mi"
  proxyMemoryLimit: "256Mi"
