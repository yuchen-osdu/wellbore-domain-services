apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: {{ printf "%s-spot" .Values.conf.appName | quote }}
  labels:
    app: {{ .Values.conf.appName | quote }}
    type: ddms
    source: python
spec:
  replicas: {{ include "wellbore.minReplicasSpot" . }}
  selector:
    matchLabels:
      provision-type: "spot"
      app: {{ .Values.conf.appName | quote }}
  template:
    metadata:
      labels:
        provision-type: "spot"
        app: {{ .Values.conf.appName | quote }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        sidecar.istio.io/proxyCPU: {{ .Values.istio.proxyCPU | quote }}
        sidecar.istio.io/proxyMemory: {{ .Values.istio.proxyMemory | quote }}
        sidecar.istio.io/proxyCPULimit: {{ .Values.istio.proxyCPULimit | quote }}
        sidecar.istio.io/proxyMemoryLimit: {{ .Values.istio.proxyMemoryLimit | quote }}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
{{- range $key, $valuesList := .Values.data.affinityLabelsSpot }}
            - weight: 80
              preference:
                matchExpressions:
                  - key: {{ $key }}
                    operator: In
                    values:
{{ toYaml $valuesList | nindent 22 }}
{{- end }}
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      serviceAccountName: {{ .Values.data.serviceAccountName | quote }}
      containers:
        - name: {{ .Values.conf.appName | quote }}
          image: {{ .Values.data.image | quote }}
          imagePullPolicy: {{ .Values.data.imagePullPolicy | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Values.conf.configmap | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/os-wellbore-ddms/healthz
              port: 8080
            initialDelaySeconds: 190
            periodSeconds: 60
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/os-wellbore-ddms/readiness
              port: 8080
            periodSeconds: 60
          resources:
            requests:
              cpu: {{ .Values.data.requestsCpu | quote }}
              memory: {{ .Values.data.requestsMemory | quote }}
            {{- if .Values.global.limitsEnabled }}
            limits:
              cpu: {{ .Values.data.limitsCpu | quote }}
              memory: {{ .Values.data.limitsMemory | quote }}
            {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
