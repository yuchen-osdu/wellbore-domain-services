apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  hosts:
    {{- if .Values.global.domain }}
    - {{ .Values.global.domain | quote }}
    {{- else }}
    - "*"
    {{- end }}
  gateways:
    - service-gateway
  http:
    - match:
        - uri:
            prefix: /api/os-wellbore-ddms
      route:
        - destination:
            host: {{ .Values.conf.appName | quote }}
            port:
              number: 80
