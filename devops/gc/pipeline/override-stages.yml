variables:
  GC_SERVICE: wellbore
  GC_VENDOR: gc
  GC_INT_TEST_TYPE: python

gc-containerize-gitlab:
  variables:
    BUILD_PATH: "./build/Dockerfile"
    BUILD_ARGS: >
      --build-arg PIP_WHEEL_DIR=python-packages
      --build-arg build_date="$CI_JOB_STARTED_AT"
      --build-arg build_number=$CI_COMMIT_SHORT_SHA
      --build-arg commit_id=$CI_COMMIT_SHORT_SHA
      --build-arg build_origin="Gitlab"
      --build-arg commit_branch=$CI_COMMIT_BRANCH

gc-containerize-gcr:
  variables:
    BUILD_PATH: "./build/Dockerfile"
    BUILD_ARGS: >
      --build-arg PIP_WHEEL_DIR=python-packages
      --build-arg build_date="$CI_JOB_STARTED_AT"
      --build-arg build_number=$CI_COMMIT_SHORT_SHA
      --build-arg commit_id=$CI_COMMIT_SHORT_SHA
      --build-arg build_origin="Gitlab"
      --build-arg commit_branch=$CI_COMMIT_BRANCH

gc-test-python:
  extends: .gc-variables
  stage: integration
  tags: ["osdu-small"]
  needs: ["gc-deploy"]
  script:
    - bash
    - curl https://sdk.cloud.google.com > install.sh
    - bash install.sh --disable-prompts
    - source /root/google-cloud-sdk/completion.bash.inc
    - source /root/google-cloud-sdk/path.bash.inc
    - python3 -m venv env
    - source env/bin/activate
    - pip install --upgrade pip
    - pip install wheel
    - >
      for REQ in $PIP_REQUIREMENTS ; do
        pip install -r $REQ
      done
    - cd tests/integration
    - echo $GC_INTEGRATION_TESTER | base64 -d > file.json
    - gcloud auth activate-service-account --key-file file.json
    - gcloud config set project $GC_PROJECT
    - >
      python gen_postman_env.py
      --token $(gcloud auth print-access-token)
      --base_url $GC_WELLBORE_BASE_URL
      --cloud_provider $GC_VENDOR
      --data_partition $GC_TENANT
      --acl_domain $DOMAIN
      --legal_tag $LEGAL_TAG
    - pytest ./functional --environment="./generated/postman_environment.json" --filter-tag=!search -p no:randomly

gc-dev2-test-python:
  extends: .gc-dev2-variables
  stage: integration
  needs: ["gc-dev2-deploy"]
  script:
    - bash
    - curl https://sdk.cloud.google.com > install.sh
    - bash install.sh --disable-prompts
    - source /root/google-cloud-sdk/completion.bash.inc
    - source /root/google-cloud-sdk/path.bash.inc
    - python3 -m venv env
    - source env/bin/activate
    - pip install --upgrade pip
    - pip install wheel pytest pytest-cov
    - >
      for REQ in $PIP_REQUIREMENTS ; do
        pip install -r $REQ
      done
    - cd tests/integration
    - echo $GC_INTEGRATION_TESTER | base64 -d > file.json
    - gcloud auth activate-service-account --key-file file.json
    - gcloud config set project $GC_PROJECT
    - >
      python gen_postman_env.py
      --token $(gcloud auth print-access-token)
      --base_url $GC_WELLBORE_BASE_URL
      --cloud_provider $GC_VENDOR
      --data_partition $GC_TENANT
      --acl_domain $DOMAIN
      --legal_tag $LEGAL_TAG
    - pytest ./functional --environment="./generated/postman_environment.json" --filter-tag=!search

gc-baremetal-test-python:
  extends: .gc-baremetal-variables
  stage: integration
  image: python:3.8
  tags: ["osdu-small"]
  needs: ["gc-baremetal-deploy"]
  script:
    - bash
    - wget -O /usr/local/bin/jq https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
    - chmod +x /usr/local/bin/jq
    - >
      export TOKEN=$(curl --location --request POST "$TEST_OPENID_PROVIDER_URL/protocol/openid-connect/token"
      --header "Content-Type: application/x-www-form-urlencoded"
      --data-urlencode "client_id=$TEST_OPENID_PROVIDER_CLIENT_ID"
      --data-urlencode "client_secret=$TEST_OPENID_PROVIDER_CLIENT_SECRET"
      --data-urlencode "scope=openid"
      --data-urlencode "grant_type=client_credentials" | jq -r ".id_token")
    - python3 -m venv env
    - source env/bin/activate
    - pip install --upgrade pip
    - pip install wheel
    - >
      for REQ in $PIP_REQUIREMENTS ; do
        pip install -r $REQ
      done
    - cd tests/integration
    - >
      python gen_postman_env.py
      --token $TOKEN
      --base_url $GC_WELLBORE_BASE_URL
      --cloud_provider "anthos"
      --data_partition $GC_TENANT
      --acl_domain $DOMAIN
      --legal_tag $LEGAL_TAG
    - pytest ./functional --environment="./generated/postman_environment.json" --filter-tag='!search|!chunking' -p no:randomly

# Disable maven job in gc-com-gke pipelines
gc-test:
  extends:
    - .gc-variables

gc-dev2-test:
  extends:
    - .gc-dev2-variables

gc-baremetal-test:
  extends:
    - .gc-baremetal-variables
