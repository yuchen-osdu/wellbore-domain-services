apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "gcp.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - "*"
  gateways:
    - service-gateway
  http:
    - match:
        - uri:
            prefix: /api/os-wellbore-ddms
      route:
        - destination:
            host: {{ include "gcp.fullname" . }}
            port:
              number: 80
