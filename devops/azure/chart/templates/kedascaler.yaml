{{$nameSuffix := include "os-wellbore-ddms.name-suffix" .}}
{{- if .Values.isAutoscalingEnabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  annotations:
{{ include "os-wellbore-ddms.commonAnnotations" . | indent 4}}
  labels:
{{ include "os-wellbore-ddms.commonLabels" . | indent 4}}
  name: {{ .Values.deployment.name }}{{ $nameSuffix }}
{{ include "os-wellbore-ddms.namespace" . | indent 2}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.deployment.name }}{{ $nameSuffix }}
  pollingInterval: 15
  cooldownPeriod: 30
  minReplicaCount: {{ .Values.minReplicaCount }}
  maxReplicaCount: {{ .Values.maxReplicaCount }}
  triggers:
  - type: azure-log-analytics
    metadata:
      workspaceIdFromEnv: WORKSPACE_ID
      clientIdFromEnv: CLIENT_ID
      tenantIdFromEnv: TENANT_ID
      clientSecretFromEnv: CLIENT_SECRET
      query: |
        let ServiceName = "{{ .Values.kedaconfig.servicepath }}{{ $nameSuffix }}/ddms";
        let AvgDuration = ago({{ .Values.kedaconfig.duration }});
        AzureDiagnostics 
        | where Category == "ApplicationGatewayAccessLog" and requestUri_s hasprefix_cs ServiceName
        | where TimeGenerated > AvgDuration
        | summarize MetricValue = count()
        | project MetricValue
      threshold: "{{ .Values.kedaconfig.threshold }}"
  - type: cpu
    metricType: "{{ .Values.kedaconfig.metricType }}"
    metadata:
      value: "{{ .Values.kedaconfig.utilization.cpu }}"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Pods
              value: 3
              periodSeconds: 30
            - type: Percent
              value: 20
              periodSeconds: 30
{{- end }}
