---
# Source: /devops/azure/chart/templates/virtual-service.yaml
#
{{- if .Values.istioDnsHost }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  annotations:
{{ include "os-wellbore-ddms.commonAnnotations" . | indent 4}}
  labels:
{{ include "os-wellbore-ddms.commonLabels" . | indent 4}}
  name: {{ .Values.deployment.name }}{{ include "os-wellbore-ddms.name-suffix" . }}
{{ include "os-wellbore-ddms.namespace" . | indent 2}}
spec:
  hosts:
  - "{{ .Values.istioDnsHost }}"
  gateways:
  - istio-gateway
  http:  
  - match:
    - uri:
        prefix: '{{ include "os-wellbore-ddms.prefix" . }}/'
        # TODO make naming more uniform across services: prefix: "/api/{{ .Chart.Name }}/v2"
    route:
    - destination:
        host: {{ .Values.deployment.name }}{{ include "os-wellbore-ddms.name-suffix" . }}
        port:
          number: 80
    corsPolicy:
      maxAge: "60m"
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Data-Partition-Id
      - Correlation-Id
      - Content-Type
      allowMethods:
      - POST
      - GET
      - PUT
      - PATCH
      - DELETE
      allowOrigins:
      - prefix: "*"
{{- end }}