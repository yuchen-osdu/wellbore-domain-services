# Default values for os-wellbore-ddms.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: osdu
deployment:
  instrumentationKey:
    secretName: central-logging
  osduSvcProperties: osdu-svc-properties
  keyvaultUrlPropertyName: ENV_KEYVAULT
  name: os-wellbore-ddms

isAutoscalingEnabled: false
maxReplicaCount: 2
minReplicaCount: 2
replicaCount: 2

# undefined by default, but you can specify it if needed
# nodepool: services

# TODO reduced resources in case of bulk workers enabled to requested:256Mi/500m, limit:1Gi/1000m
resources:
 limits:
   memory: 2Gi
   cpu: 4000m
 requests:
   memory: 2Gi
   cpu: 1000m

kedaconfig:
  servicepath: "/api/os-wellbore-ddms" #monitor ddms end points
  duration: "2m"
  thresholdcoefficient: "0.8"
  threshold: "1600"
  metricType: "Utilization"
  utilization:
    cpu: 70

probes:
  startup:
    failureThreshold: 6
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 5
    timeoutSeconds: 5

annotations:
  buildNumber: []
  buildOrigin: AzureDevops build/#{Build.DefinitionName}#
  commitBranch: []
  commitId: []

image:
  repository: community.opengroup.org:5555/osdu/platform/domain-data-mgmt-services/wellbore/wellbore-domain-services/wellbore-domain-services-master
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest


tempDeployment:
  enabled: false
  name: prxxxx

labels:
  aadpodidbinding: osdu-identity
  env: gitlab

configMap:
  data:
    storageEndpoint: http://storage.osdu/api/storage
    searchEndpoint: http://search-service.osdu/api/search
    partitionEndpoint: http://partition.osdu/api/partition
    schemaEndpoint: http://schema-service.osdu/api/schema
    usePartitionService: 'enabled'
    loggerLevel: 'INFO'
    environmentName: gitlab
    swaggerFullUrlEnabled: 'true'
  name: os-wellbore-ddms-envs

ingress:
  enabled: false
  extraAnnotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/request-timeout: "300"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    kubernetes.io/ingress.class: azure/application-gateway
  hosts:
    host: # leave it empty for our dev cluster
    pathPrefix: /api/os-wellbore-ddms
  tlsSecret: osdu-certificate

authorizationPolicy:
  name: wellbore-jwt-authz


istioDnsHost: ""