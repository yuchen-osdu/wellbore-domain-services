parameters:
  - name: serviceUrl
    type: string
  - name: osduBaseUrl
    type: string
  - name: cloudProvider
    type: string
  - name: aclDomain
    type: string
  - name: legalTag
    type: string
  - name: dataPartition
    type: string
  - name: environmentName
    type: string
    default: "UndefinedEnv"
  - name: skipCertValidation
    # Used in case of invalid certificate (self-signed,...) 
    type: boolean
    default: false
# The following parameters allow to inject a template intented to perform authentication and generate a token
# the token is to be added as a secure output variable:
#   echo "##vso[task.setvariable variable=token;issecret=true]${token}"
  - name: authenticationTemplate
    type: string
    default: ""
  - name: authenticationTemplateParameters
    type: object
    default: {}

steps:

- bash: |
      set -e

      echo "parameters.skipCertValidation: ${{ parameters.skipCertValidation }}"
      echo "parameters.serviceUrl: ${{ parameters.serviceUrl }}"
      echo "parameters.osduBaseUrl: ${{ parameters.osduBaseUrl }}"
      echo "parameters.cloudProvider: ${{ parameters.cloudProvider }}"
      echo "parameters.aclDomain: ${{ parameters.aclDomain }}"
      echo "parameters.legalTag: ${{ parameters.legalTag }}"
      echo "parameters.dataPartition: ${{ parameters.dataPartition }}"
      echo "parameters.environmentName: ${{ parameters.environmentName }}"
  displayName: 'Display Info'

- task: Bash@3
  displayName: 'testReportBaseName'
  inputs:
    targetType: 'inline'
    script: |
        prefix=$(System.StageName)#$(System.JobAttempt)
        echo "##vso[task.setvariable variable=testReportBaseName]${prefix}"

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.8'
    addToPath: true


# This template is injected by parameters
# and will generate the $(token) variable
- template: ${{ parameters.authenticationTemplate }}
  parameters: 
    ${{ each parameter in parameters.authenticationTemplateParameters }}:
      ${{ parameter.key}}: ${{ parameter.value}}


- bash: |
    set -e

    insecure_flag=""
    checkCert="True"

    # Depending on the value of 'skipCertValidation' we add the '--insecure' option to newman
    # and update checkCert for pytest
    skipCertValidation="${{ lower(parameters.skipCertValidation) }}"
    if $skipCertValidation
    then
      echo "Adding --insecure flag to e2e tests to disable cert validation."
      insecure_flag="--insecure"
      checkCert=""

    fi

    echo "##vso[task.setvariable variable=insecure_flag]${insecure_flag}"
    echo "##vso[task.setvariable variable=checkCert]${checkCert}"

  displayName: 'Create test variables'

- bash: |
    set -ex

    python tests/integration/gen_postman_env.py --token $(token) --base_url ${{ parameters.osduBaseUrl }} --cloud_provider ${{ parameters.cloudProvider }} --acl_domain ${{ parameters.aclDomain }} --legal_tag ${{ parameters.legalTag }} --data_partition ${{ parameters.dataPartition }}

    newman run tests/dependencies/core_dependencies_test.postman_collection.json -e generated/postman_environment.json -r junit,cli --reporter-junit-export dependencies_tests_report_$(testReportBaseName).xml --timeout-request 10000 $(insecure_flag)

  displayName: 'Check healthiness of Core services'
  condition: ne('${{ parameters.cloudProvider }}', 'gcp')
  continueOnError: true

- bash: |
    set -ex

    echo "Testing App on ${{ parameters.serviceUrl }}"

    python gen_postman_env.py --token $(token) \
        --base_url ${{ parameters.serviceUrl }} \
        --cloud_provider ${{ parameters.cloudProvider }} \
        --acl_domain ${{ parameters.aclDomain }} \
        --legal_tag ${{ parameters.legalTag }} --data_partition ${{ parameters.dataPartition }}

    pip install virtualenv
    virtualenv venv37
    source venv37/bin/activate
    pip install -r ../../requirements_dev.txt

    pytest functional/ --filter-tag=!search \
        --junit-xml=$(testReportBaseName)_int_tests_report.xml  -o junit_suite_name="wdms_integration_$(testReportBaseName)" \
        --environment=generated/postman_environment.json \
        --retry-on-error=502 \
        $(insecure_flag)
    deactivate
  displayName: 'RUN INTEGRATION-E2E'
  workingDirectory: tests/integration

- bash: |
    set -ex

    pip install virtualenv
    virtualenv venv37
    source venv37/bin/activate
    pip install -r ./requirements_dev.txt

    echo "Testing App on ${{ parameters.serviceUrl }}"

    pytest tests/integration/security/test_auth.py --base_url ${{ parameters.serviceUrl }} --check_cert "$(checkCert)" --token="$(token)" --junit-xml=$(testReportBaseName)_auth_tests_report.xml -o junit_suite_name="wdms_auth_$(testReportBaseName)"

    deactivate
  displayName: 'RUN INTEGRATION-AUTH'
  workingDirectory: ./


- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/*tests_report*.xml'
  condition: always()
