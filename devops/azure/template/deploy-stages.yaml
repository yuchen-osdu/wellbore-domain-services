parameters:
  - name: providers
    type: object
    default: []
        # ex:
        # providers:
        #   - name: Azure
        #     short_name: az
        #     varGroupPrefix: ""
        #     environments: 
        #     - name: dev
        #       # TODO: The following templates needs to be injected as parameters
        #       authenticationTemplate: ${{ getImageTemplate }}
        #       authenticationTemplateParameters: ${{ getImageTemplateParameters }}
        #       preDeployTemplates:
        #       - template: ${{ my_template }}
        #         parameters: ${{ my_template_parameters }}
        #       - ...
        #     getImageTemplate: ${{ authenticationTemplate }}
        #     getImageTemplateParameters: ${{ authenticationTemplateParameter }}

stages:

- ${{ each provider in parameters.providers }}:
  - ${{ each environment in provider.environments }}:
    - stage: 'Deploy_${{ provider.name }}_R3MVP_${{ environment.name }}'
      variables:
      - group: '${{ provider.varGroupPrefix }}${{ provider.name }} Target Env Secrets - ${{ environment.name }}'
      - group: '${{ provider.varGroupPrefix }}${{ provider.name }} Target Env - ${{ environment.name }}'
      - name: env # This variable is used as input of the helm template
        value: ${{ environment.name }}
      jobs:
      - deployment: Deploy
        pool:
          vmImage: "ubuntu-latest"
        environment: ${{ environment.name }}
        strategy:
          runOnce:
            deploy:
              steps:
              - template: steps-define-variables.yaml
              - template: ${{ provider.getImageTemplate }}
                parameters: ${{ provider.getImageTemplateParameters }}
              - ${{ each preDeployTemplate in environment.preDeployTemplates }}:
                - template: ${{ preDeployTemplate.template }}
                  parameters:
                    ${{ each parameter in preDeployTemplate.parameters }}:
                      ${{ parameter.key }}: ${{ parameter.value }}
              - template: steps-push-image.yaml
                parameters:
                  azureSubscription: $(SERVICE_CONNECTION_NAME)
                  sourceACRName: $(us_acr_name)
                  destinationACRName: $(CONTAINER_REGISTRY_NAME)
                  environment: ${{ environment.name }}
                  imageTag: $(defineVariables.tag_name_output)
                  appName: $(app)
              - template: devops/tasks/aks-deployment-steps.yml@pipelineTemplatesRepo
                parameters:
                  environment: ${{ environment.name }}
                  serviceName: $(app)
                  providerName:  ${{ provider.short_name }}
                  chartPath: $(chartPath)
                  valuesFile: $(valuesFile)
                  hldRegPath: $(hldRegPath)
              - template: devops/tasks/flux-service-wait.yml@pipelineTemplatesRepo
                parameters:
                  environment: ${{ environment.name }}
                  serviceName: $(fluxServiceName)
                  imageRepoName: $(app)
                  skipDeploy: false

    - stage: Test_${{ provider.name }}_R3MVP_${{ environment.name }}
      dependsOn:
      - Deploy_${{ provider.name }}_R3MVP_${{ environment.name }}
      variables:
      - group: '${{ provider.varGroupPrefix }}${{ provider.name }} Target Env - ${{ environment.name }}'
      - template: 'vars/global_vars.yml'
      jobs:
        - job: e2e_test
          steps:  
            - template: steps-e2e-tests.yaml
              parameters:
                baseUrl: "https://$(DNS_HOST)"
                basePath: ${{ variables.base_path }}
                aclDomain: $(DOMAIN)
                legalTag: $(LEGAL_TAG)
                dataPartition: $(MY_TENANT)
                cloudProvider:  ${{ provider.short_name }}
                authenticationTemplate: ${{ environment.authenticationTemplate }}
                authenticationTemplateParameters: ${{ environment.authenticationTemplateParameters }}
                environmentName: ${{ environment.name }}
