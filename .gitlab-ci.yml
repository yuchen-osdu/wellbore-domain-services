variables:
  PIP_REQUIREMENTS: "requirements.txt"
  PIP_REQUIREMENTS_TOOLING_ONLY: "requirements_dev.txt"
  PIP_EXTRA_INDEX_URLS: "https://community.opengroup.org/api/v4/projects/465/packages/pypi/simple"

  IGNORE_PYTHON_SETUP: "wdms_client/request_builders/wdms/recursive_delete/ wdms_client/request_builders/wdms/search_apis/"

  AZURE_SERVICE: wellbore-ddms
  AZURE_DOCKER_SUBDIR: devops/azure/Dockerfile
  AZURE_TEST_SUBDIR: tests/integration
  AZURE_TEST_TYPE: python

  AWS_SERVICE: wellbore-ddms
  AWS_SERVICE_GATEWAY: osdu-services/osdu-gateway
  AWS_SERVICE_NAMESPACE_SUFFIX: wellbore-ddms
  AWS_ENVIRONMENT: dev
  AWS_BUILD_SUBDIR: provider/os-wellbore-ddms-aws/build-aws
  AWS_TEST_SUBDIR: tests/aws-test/build-aws
  AWS_CHART_SUBDIR: devops/aws/chart
  AWS_INT_TEST_TYPE: python
  AWS_DEPLOY_TARGET: TF
  AWS_EKS_DEPLOYMENT_NAME: os-wellbore-ddms

  # ignore model_curated_test.py workaround because ci/cd hang-out when test are long.
  PYTEST_OPTIONS: "--ignore=tests/unit/model/model_curated_test.py --durations=25 --strict-markers"

include:
  - project: "osdu/platform/ci-cd-pipelines"
    file: "standard-setup.yml"

    # for compile-and-unit-test
  - project: "osdu/platform/ci-cd-pipelines"
    file: "build/python.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/fossa-python.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/gitlab-ultimate.yml"

  # Opt-in SBOM-based Python dependency scanning (reads uv.lock directly).
  # Replaces the deprecated gemnasium-python analyzer, which cannot install
  # numpy>=2.5 (requires Python >=3.12, gemnasium runs Python <=3.11).
  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/sbom-python.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/gc-global.yml"
  
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/cimpl-global.yml"  

  # IBM it tests "ibm-test"
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/aws-global.yml"

  # AWS overrides
  - local: "/devops/aws/pipeline/override-stages.yml" 

  # AZURE it tests "azure_test_py"
  - local: "/devops/azure/azure-wellbore.yml" 

  # Google Cloud int tests "gc-test-python" & "gc-baremetal-test-python"
  - local: "devops/gc/pipeline/override-stages.yml"
  - local: "devops/core-plus/pipeline/override-stages.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "reporting/reporting.yml"

#Override Python Image defined in python.yml
.python:
  image: python:3.13-bookworm

verify_existing_requirements:
  tags: ["osdu-small"]
  extends:
    - .python
    - .skipForTriggeringMergeRequests
  stage: build
  script:
    # uv.lock is the source of truth; requirements*.txt are generated exports.
    - python -m pip install --upgrade pip "uv==0.11.19"
    # fail if uv.lock is out of date with pyproject.toml
    - uv lock --locked
    # regenerate the exported requirements files from the lock
    - ./scripts/regenerate-requirements.sh
    - git diff
    # fail if the committed lock or exports drifted from what was regenerated
    - git diff --exit-code uv.lock requirements.txt requirements_dev.txt
  artifacts:
    when: always
    paths:
      - "uv.lock"
      - "requirements*.txt"
    expire_in: 2 days

compile-and-unit-test:
  tags: ["osdu-large"]
  artifacts:
    when: always
    paths:
      - all-requirements.txt
      - ./**/python-*-output.txt
      - spec/generated/openapi.json

pylint:
  tags: ["osdu-small"]
  extends:
    - .python
    - .skipForTriggeringMergeRequests
  stage: build
  allow_failure: true
  script:
    - pylint app

containerize:
  extends: .skipForTriggeringMergeRequests
  stage: containerize
  image: docker:19.03
  tags: ["osdu-small"]
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA
  script:
    - echo ---- ---- ---- SYSTEM DEPENDENCIES ---- ---- ----
    - apk update
    - apk add git
    - echo ---- ---- ---- BUILD IMAGE ---- ---- ----
    - commit_id=$(git log -n 1 --pretty="%h")
    - echo ---- ---- TAG NAME
    - tag_name="_gitlab_$commit_id"
    - echo $tag_name
    - echo ---- ---- DATE
    - current_utc_date=`date --utc`
    - echo $current_utc_date
    - echo ---- ---- COMMIT BRANCH
    - commit_branch=$commit_id
    - echo $commit_branch
    - echo ---- ---- BUILD IMAGE
    - docker build -t $IMAGE_TAG -t=$CI_REGISTRY_IMAGE:latest --rm . -f ./build/Dockerfile --build-arg PIP_WHEEL_DIR=python-packages --build-arg build_date="$current_utc_date" --build-arg build_number=$commit_id --build-arg commit_id=$commit_id --build-arg build_origin="Gitlab" --build-arg commit_branch=$commit_branch
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo ---- ---- PUSH IMAGE
    - docker push $IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:latest

# Allow failure on flaky deployments
aws-containerize:
  allow_failure: true

azure_containerize:
  allow_failure: true

gc-deploy:
  allow_failure: true

azure_deploy:
  allow_failure: true

aws-update-tf:
  allow_failure: true

aws-test-python:
  allow_failure: true

azure_swagger_test:
  allow_failure: true

azure_test_py:
  allow_failure: true
