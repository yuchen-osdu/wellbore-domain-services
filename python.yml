
.python:
  image: $CI_REGISTRY/divido/python-git/python-git:v1.0
  tags: ['osdu-medium']

  cache:
    key: $CI_JOB_IMAGE
    paths:
      - venv

  before_script:
    - test -z "$PIP_REQUIREMENTS" && export PIP_REQUIREMENTS="requirements.txt"

    # Establish a virtual environment for the packages, which is cached between runs
    - python3 -m venv venv
    - source venv/bin/activate
    - pip3 install --upgrade pip
    - pip3 install wheel

    # Install all the requirements
    - |
      for req in $PIP_REQUIREMENTS; do
        echo "--------------------------------------------------------------------------------"
        echo -e "Installing $req\n"
        pip3 install -r $req
      done

compile-and-unit-test:
  extends:
    - .python
    - .skipForTriggeringMergeRequests

  stage: build
  script:
    - test -z "$PYTEST_DIR" && export PYTEST_DIR="tests/unit"
    - pytest --junit-xml=unit_tests_report.xml --cov=app --cov-report=xml:coverage.xml --cov-report=term "$PYTEST_DIR"

  coverage: '/^(?i)(TOTAL).*\s+(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: unit_tests_report.xml
      cobertura: coverage.xml
