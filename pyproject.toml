[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wellbore-domain-services"
version = "0.29"
description = "Wellbore Data Management Services (Wellbore-DMS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12,<0.122.0",
    "pydantic>=2.11.3",
    "aiohttp>=3.13.3",
    "pyarrow>=20.0.0",
    "pandas>=2.3.2",
    "uvicorn",
    "starlette>=0.47.1,<=0.50.0",
    "urllib3>=0.26.3",
    "typing-extensions",
    "Click",
    "backoff",
    "structlog",
    "python-rapidjson",
    "jsonpath-ng",
    "natsort",
    "prometheus-fastapi-instrumentator",
    "httpx",
    "numpy",
    "jsonschema",
    "anyio>=4.10.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-semantic-conventions",
    "azure-monitor-opentelemetry-exporter",
    "opentelemetry-exporter-gcp-trace",
    # for chunking feature
    "s3fs",
    "fsspec",
    "python-ulid",
    "osdu-api==1.0.3",
    "osdu-log-recognition-lib==0.29.0",
    "osdu-data-ecosystem-storage==0.29.0",
    "osdu-data-ecosystem-search==0.29.0",
    "osdu-core-lib-python-ibm==0.29.0",
    "osdu-core-lib-python-gcp==0.29.0",
    "osdu-core-lib-python-azure==0.29.0",
    "osdu-core-lib-python-aws==0.29.0",
    "osdu-core-lib-python-baremetal==0.29.0",
    "osdu-core-lib-python==0.29.0",
    "osdu-data-ecosystem-schema==0.29.0",
    "wellbore-schema-manipulation==0.29.0",
    "packaging>=25.0",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
dev = [
    "osdu-wbddms-worker==0.2.0",
    "pip-tools>=7.5.1",
    "pytest",
    "asgi_lifespan",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-xdist",
    "pytest-randomly",
    "pytest-mock",
    "hypothesis",
    "openapi-spec-validator>=0.7.2",
    "requests>=2.32.3", # used by starlette.TestClient for testing
    # the following are used in functional integration tests
    "pytest-dependency",
    "munch",
    # Generates fake token for local integration tests runs
    "pyjwt",
    "deepdiff",
    "pylint",
    "uvicorn",
    "allure-pytest>=2.13.0",
    "allure-python-commons>=2.13.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.uv]
# You can add uv-specific configurations here if needed

[[tool.uv.index]]
url = "https://community.opengroup.org/api/v4/projects/465/packages/pypi/simple/"

[tool.pylint."messages control"]
disable = [
    "missing-docstring",
    "line-too-long",
    "too-few-public-methods",
    "fixme",
]