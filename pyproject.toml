[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wellbore-domain-services"
version = "0.29"
description = "Wellbore Data Management Services (Wellbore-DMS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "pydantic>=2.11.3",
    "aiohttp>=3.14.1",
    "pyarrow>=20.0.0",
    "pandas>=2.3.2",
    "uvicorn",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "pyjwt>=2.13.0",
    "cryptography>=46.0.7",
    "azure-core>=1.38.0",
    "protobuf>=6.33.5",
    "pyasn1>=0.6.3",
    "typing-extensions",
    "click>=8.4.1",
    "backoff",
    "structlog",
    "python-rapidjson",
    "jsonpath-ng",
    "natsort",
    "prometheus-fastapi-instrumentator",
    "httpx",
    "numpy",
    "jsonschema",
    "anyio>=4.10.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-semantic-conventions==0.61b0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b46",
    "opentelemetry-exporter-gcp-trace",
    "opentelemetry-exporter-otlp-proto-http==1.40.0",
    # for chunking feature
    "s3fs",
    "fsspec",
    "python-ulid",
    "osdu-api==1.2.0",
    "osdu-log-recognition-lib==0.29.0",
    "osdu-data-ecosystem-storage==0.29.0",
    "osdu-data-ecosystem-search==0.29.0",
    "osdu-core-lib-python-ibm==0.29.0",
    "osdu-core-lib-python-gcp==0.29.0",
    "osdu-core-lib-python-azure==0.29.0",
    "osdu-core-lib-python-aws==0.29.0",
    "osdu-core-lib-python-baremetal==0.29.0",
    "osdu-core-lib-python==0.29.0",
    "osdu-data-ecosystem-schema==0.29.0",
    "wellbore-schema-manipulation==0.29.0",
    "packaging>=25.0",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
dev = [
    "osdu-wbddms-worker==0.3.0",
    "pip-tools>=7.5.1",
    "pytest",
    "asgi_lifespan",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-xdist",
    "pytest-randomly",
    "pytest-mock",
    "hypothesis",
    "openapi-spec-validator>=0.7.2",
    "requests>=2.32.3", # used by starlette.TestClient for testing
    # the following are used in functional integration tests
    "pytest-dependency",
    "munch",
    # Generates fake token for local integration tests runs
    "pyjwt",
    "deepdiff",
    "pylint",
    "uvicorn",
    "allure-pytest>=2.13.0",
    "allure-python-commons>=2.13.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.uv]
# Match pip's `--extra-index-url` merge behaviour: consider every configured
# index and pick the best version, instead of uv's default "first-index" which
# would pin older packages mirrored on the OSDU private index.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
url = "https://community.opengroup.org/api/v4/projects/465/packages/pypi/simple/"

[tool.pylint."messages control"]
disable = [
    "missing-docstring",
    "line-too-long",
    "too-few-public-methods",
    "fixme",
]
